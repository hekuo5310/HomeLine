name: homeline
description: A cross-platform client for a self-hosted family telephone exchange.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.0
  dio: 5.11.1
  json_annotation: 4.12.0
  flutter_secure_storage: 11.2.0
  sqflite: 2.4.4+2
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0
  permission_handler: 13.0.2
  uuid: 4.6.0
  sip_ua: 1.1.0
  flutter_webrtc: 1.6.2+hotfix.4
  logger: 2.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: 2.16.2
  json_serializable: 6.14.1
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
