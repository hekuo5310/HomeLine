name: Android MVP
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/data/dto/models.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-results
          path: build/app/reports/tests/testDebugUnitTest/
      - uses: actions/upload-artifact@v4
        with:
          name: homeline-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
